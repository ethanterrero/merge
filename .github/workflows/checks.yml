name: Checks
on:
  push:
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
  # Edge Functions: one directory per function under supabase/functions, each with its
  # own deno.json and committed deno.lock. --frozen fails if an import doesn't match the
  # lockfile. Directories starting with "_" hold shared code, checked through importers.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Supabase CLI 2.120.0 (pinned in package-lock.json) runs Edge Runtime v1.77.4, which
      # embeds Deno 2.1.4 (supabase/edge-runtime deno/Cargo.toml at that tag). The hosted
      # runtime isn't published per project; re-check this when the CLI is bumped.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: deno check
        run: |
          shopt -s nullglob
          status=0
          for dir in supabase/functions/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            if [ ! -f "$dir/deno.json" ] || [ ! -f "$dir/deno.lock" ]; then
              echo "::error file=${dir}::Each function needs a deno.json and a committed deno.lock (see supabase/functions/delete-account)."
              status=1
              continue
            fi
            (cd "$dir" && deno check --frozen '**/*.ts') || status=1
          done
          exit $status
      # --permit-no-files keeps this green for functions without tests.
      - name: deno test
        run: |
          shopt -s nullglob
          status=0
          for dir in supabase/functions/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            (cd "$dir" && deno test --frozen --permit-no-files) || status=1
          done
          exit $status
  migration-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so origin/<base> and the merge base are both present.
          fetch-depth: 0
      - name: New migrations are numbered above the base branch's highest
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-migration-order.sh "origin/$BASE_REF"
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The Supabase CLI and Prettier (both pinned by the lockfile) generate the types.
      - run: npm ci
      - name: Apply migrations, generate types, run SQL tests
        run: |
          mkdir -p "$RUNNER_TEMP/database-types"
          DB_TYPES_OUT="$RUNNER_TEMP/database-types/database.types.ts" scripts/db-test.sh
      # Uploaded before the comparison, so a failing run still publishes the file.
      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: ${{ runner.temp }}/database-types/database.types.ts
          if-no-files-found: warn
      - name: Committed database.types.ts matches the migrations
        if: always()
        run: |
          generated="$RUNNER_TEMP/database-types/database.types.ts"
          if [ ! -s "$generated" ]; then
            echo "::error::Types weren't generated; see the step above."
            exit 1
          fi
          if ! git diff --no-index --exit-code apps/mobile/src/lib/database.types.ts "$generated"; then
            echo "::error file=apps/mobile/src/lib/database.types.ts::database.types.ts doesn't match the migrations. Download the database-types artifact from this run and commit it (see CONTRIBUTING.md, \"Database changes\")."
            exit 1
          fi
