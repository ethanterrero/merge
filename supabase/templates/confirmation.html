<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Merge code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #F5F7F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1C221E;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #F5F7F5;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 16px;">
            <tr>
              <td style="padding: 32px 28px 8px 28px;">
                <p style="margin: 0; font-size: 20px; font-weight: 700; color: #2E6B3E;">Merge</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 28px 0 28px;">
                <h1 style="margin: 0 0 12px 0; font-size: 22px; line-height: 1.3; color: #1C221E;">Welcome to Merge</h1>
                <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.5;">Enter this 6-digit code in the Merge app to confirm your email and sign in.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 28px;">
                <p style="margin: 0; padding: 16px 0; background-color: #E3F0E6; border-radius: 12px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #1C221E; font-family: 'SF Mono', Menlo, Consolas, monospace;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 28px 32px 28px;">
                <p style="margin: 0 0 12px 0; font-size: 15px; line-height: 1.5;">The code expires in 10 minutes.</p>
                <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #59625C;">If you didn't ask for this, ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
